<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギャラリー | もいもい -FMmoimoi- 公式サイト</title>
  <meta name="description" content="VTuber もいもい（FMmoimoi）のイラストギャラリー。">
  <meta property="og:title" content="もいもい -FMmoimoi- 公式サイト">
  <meta property="og:description" content="VTuber もいもい（FMmoimoi）の公式サイト。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/top/sticker.webp">
  <meta name="theme-color" content="#FFC93C">
  <link rel="icon" type="image/png" href="images/moimoi_icon.png">
  <link rel="apple-touch-icon" href="images/moimoi_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/gallery-data.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>

  <script src="js/flowers.js"></script>

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="images/top/icon.webp" alt="" width="44" height="44">
      <span>FM<b>moimoi</b></span>
    </a>
    <button class="menu-btn" aria-label="メニュー" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
    <nav id="nav" class="nav">
      <a href="index.html#profile">プロフィール</a>
      <a href="index.html#movie">動画</a>
      <a href="index.html#news">ニュース</a>
      <a href="schedule.html">スケジュール</a>
      <a href="gallery.html" aria-current="page">ギャラリー</a>
      <a href="index.html#links">リンク</a>
    </nav>
  </header>

  <main>

    <!-- ===== ページの見出し ===== -->
    <section class="page-hero">
      <svg class="hy hy-l" style="--ha:#7FA8F5;--hb:#A88CF0;--hc:#B9D3FF" aria-hidden="true"><use href="#hydrangea"/></svg>
      <svg class="hy hy-r" style="--ha:#F49CC8;--hb:#B58CF2;--hc:#FFC6E2" aria-hidden="true"><use href="#hydrangea"/></svg>
      <svg class="spin-flower sf-1" aria-hidden="true"><use href="#sunflower"/></svg>
      <h1 class="page-title"><span class="en">GALLERY</span>ギャラリー</h1>
      <div class="field field-mini" aria-hidden="true">
        <svg style="--d:0s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:.6s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:1.1s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:.3s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:.9s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:1.4s"><use href="#sunflower-plant"/></svg>
      </div>
    </section>

    <section class="section gallery gallery-page">
      <p class="section-sub"><span class="gallery-count"></span>　タップすると大きく見られます</p>

      <!-- images/gallery/picup → images/gallery の順に、全部の画像が自動で並びます -->
      <div class="gallery-grid" data-show="all"></div>

      <div class="gallery-more">
        <a class="more-btn" href="index.html">
          <svg aria-hidden="true"><use href="#sunflower"/></svg>
          <span class="more-label">BACK</span>
          <span class="more-sub-back">トップへもどる</span>
        </a>
      </div>
    </section>

  </main>

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="footer-flowers" aria-hidden="true">
      <svg class="hy" style="--ha:#7FA8F5;--hb:#A88CF0;--hc:#B9D3FF"><use href="#hydrangea"/></svg>
      <svg class="fp"><use href="#sunflower-plant"/></svg>
      <svg class="fp"><use href="#sunflower-plant"/></svg>
      <svg class="hy" style="--ha:#F49CC8;--hb:#B58CF2;--hc:#FFD0E7"><use href="#hydrangea"/></svg>
      <svg class="fp"><use href="#sunflower-plant"/></svg>
      <svg class="hy" style="--ha:#9C8CF0;--hb:#7FA8F5;--hc:#D2C6FF"><use href="#hydrangea"/></svg>
    </div>
    <div class="footer-body">
      <a class="logo" href="index.html">
        <img src="images/top/icon.webp" alt="" width="44" height="44">
        <span>FM<b>moimoi</b></span>
      </a>
      <p class="copy">©MOCHI</p>
      <a class="to-top" href="#top">▲ TOP</a>
    </div>
  </footer>

  <!-- 拡大表示 -->
  <dialog class="lightbox" aria-label="画像の拡大表示">
    <button class="lb-close" aria-label="閉じる">×</button>
    <button class="lb-nav lb-prev" aria-label="前の画像">‹</button>
    <img src="" alt="">
    <button class="lb-nav lb-next" aria-label="次の画像">›</button>
  </dialog>
</body>
</html>
