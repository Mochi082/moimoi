      <a href="index.html#links">リンク</a>
    </nav>
  </header>

  <main>

    <!-- ===== ページの見出し ===== -->
    <section class="page-hero">
      <svg class="hy hy-l" style="--ha:#7FA8F5;--hb:#A88CF0;--hc:#B9D3FF" aria-hidden="true"><use href="#hydrangea"/></svg>
      <svg class="hy hy-r" style="--ha:#F49CC8;--hb:#B58CF2;--hc:#FFC6E2" aria-hidden="true"><use href="#hydrangea"/></svg>
      <svg class="spin-flower sf-1" aria-hidden="true"><use href="#sunflower"/></svg>
      <h1 class="page-title"><span class="en">SCHEDULE</span>配信スケジュール</h1>
      <div class="field field-mini" aria-hidden="true">
        <svg style="--d:0s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:.6s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:1.1s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:.3s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:.9s"><use href="#sunflower-plant"/></svg>
        <svg style="--d:1.4s"><use href="#sunflower-plant"/></svg>
      </div>
    </section>

    <section class="section schedule">

      <!--
        ===== スケジュールの書き方 =====
        ・予定を1行ずつ <li> で書くだけです（順番はバラバラでもOK）
        ・カレンダーは開いた日の月が自動で表示され、日付・曜日も自動です
        ・来月以降の予定も、ここに書き足しておけば その月に表示されます
        ・data-date  … 日にち（年-月-日）
        ・data-time  … 時間（なくてもOK）
        ・data-type  … 種類   live（配信） video（動画） collab（コラボ） off（お休み）
        例）<li data-date="2026-10-17" data-time="21:00" data-type="live">雀魂 だれでも参加型</li>
      -->
      <ul class="schedule-src" hidden>
        <li data-date="2026-10-17" data-time="21:00" data-type="live">雀魂 だれでも参加型</li>
        <li data-date="2026-10-18" data-time="20:00" data-type="video">動画公開</li>
        <li data-date="2026-10-19" data-time="22:00" data-type="collab">コラボ配信</li>
        <li data-date="2026-10-20" data-type="off">お休み</li>
      </ul>

      <div class="cal-card reveal">
        <h2 class="cal-month"></h2>
        <ul class="cal-legend">
          <li class="type-live">配信</li>
          <li class="type-video">動画</li>
          <li class="type-collab">コラボ</li>
          <li class="type-off">お休み</li>
        </ul>
        <div class="calendar"></div>
        <!-- 日付を押すと、ここにその日の詳細が出ます -->
        <div class="cal-detail" aria-live="polite"></div>
      </div>

      <p class="section-sub cal-note">予定は変わることがあります。最新情報は X（@moymoyradio）をチェックしてね！</p>
    </section>

  </main>
